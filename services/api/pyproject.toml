[project]
name = "labellens-api"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.8", "pydantic-settings>=2.4",
  "sqlalchemy>=2.0", "alembic>=1.13", "psycopg[binary]>=3.2", "pyjwt[crypto]>=2.9",
  "pillow>=10.4", "python-multipart>=0.0.9", "httpx>=0.27",
]
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools.packages.find]
include = ["app*", "data_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 140
extend-exclude = ["alembic/versions"]
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "E702"]
